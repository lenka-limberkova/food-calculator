<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Food Calculator</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap"
  rel="stylesheet"
>
</head>

<body>

  <main class="app">

    <div class="page-wrapper">

      <!-- App introduction -->
      <header class="intro">

<h1>
  <button type="button" class="app-logo">
    Food Calculator
  </button>
</h1>
        <p>
          Search for foods and add them to your selection.
        </p>

      </header>


      <!-- Main two-column layout -->
      <div class="main-content">


        <!-- SEARCH COLUMN -->
        <section class="search-panel">

          <h2>Search foods</h2>

          <form class="search-form">

            <input
              type="search"
              placeholder="Search foods..."
              aria-label="Search foods"
            >

            <button
  type="submit"
  class="search-button"
  aria-label="Search"
>
  <img src="/assets/icons/search.svg" alt="">
</button>

          </form>


          <!-- Search results will be generated by JavaScript -->
          <div class="search-results">
          </div>

        </section>


        <!-- SELECTION COLUMN -->
        <section class="selection-panel">

          <div class="selection-header">

            <h2>Your selection</h2>

            <button
              type="button"
              class="reset-button"
            >
              Reset
            </button>

          </div>


          <!-- Visible when no foods are selected -->
          <div class="empty-state">

            <h3>No foods selected yet.</h3>

            <p>
              Search for a food and add it to your selection.
            </p>

          </div>


          <!-- Selected food cards will be generated by JavaScript -->
          <div class="selected-foods">
          </div>


          <!-- Nutrition totals will be generated by JavaScript -->
          <div class="totals">
          </div>

        </section>

      </div>

    </div>

  </main>


  <script src="app.js"></script>

</body>

</html>
